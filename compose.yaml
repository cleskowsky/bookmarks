services:
  app:
    build:
      tags:
        - "bookmarks:${version}"
    ports:
      - "8080"
    volumes:
      - data:/var/lib
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    labels:
      - traefik.http.routers.app.rule=Host(`bm.leskowsky.net`)

  traefik:
    image: traefik:v3.0
    ports:
      - "8080:8080"
      - "443:443"
      - "80:80"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  data:
