services:
  app:
    build:
      tags:
        - "bookmarks:${version}"
    ports:
      - "8080"
    volumes:
      - data:/var/lib
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    labels:
      - traefik.http.routers.app.rule=Host(`bm.leskowsky.net`)

volumes:
  data:
